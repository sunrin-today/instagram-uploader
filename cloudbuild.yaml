steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-f'
      - Dockerfile.once
      - '-t'
      - '${_IMAGE}'
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_IMAGE}'

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - sunrin-today-instagram-uploader
      - '--image=${_IMAGE}'
      - '--region=${_REGION}'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--max-retries=1'
      - '--task-timeout=900s'
      - '--set-secrets=${_SECRETS}'
      - '--set-env-vars=${_ENV_VARS}'

substitutions:
  _REGION: asia-northeast1
  _SERVICE_ACCOUNT: sunrin-today-uploader-sa@sunrin-today.iam.gserviceaccount.com
  _IMAGE: >-
    asia-northeast1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/sunrin-today-instagram-uploader:${COMMIT_SHA}
  _SECRETS: >-
    DATABASE_URL=database-url:latest,
    INSTAGRAM_ACCESS_TOKEN=instagram-access-token:latest,
    INSTAGRAM_DELETE_ACCESS_TOKEN=instagram-delete-access-token:latest,
    DISCORD_WEBHOOK_URL=discord-webhook-url:latest,
    DISCORD_ERROR_MENTION_IDS=discord-error-mention-ids:latest,
    API_KEY=api-key:latest
  _ENV_VARS: >-
    NODE_ENV=production,
    SCHOOL_NAME=선린인터넷고등학교,
    INSTAGRAM_USERNAME=sunrin_today,
    INSTAGRAM_IG_ID=1784146540991058488,
    INSTAGRAM_DELETE_GRAPH_API_BASE=https://graph.facebook.com/v25.0,
    GCS_BUCKET=sunrin-today-instagram,
    API_BASE_URL=https://api.sunrin.kr,
    JOB_MAX_RETRIES=1

options:
  logging: CLOUD_LOGGING_ONLY